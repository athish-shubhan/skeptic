[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skeptic"
version = "0.1.0"
description = "A small research library that makes false discoveries hard to produce."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Athish Shubhan" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pyyaml>=6",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "xgboost>=2.0", "optuna>=3.5"]
parquet = ["pyarrow>=14"]
dev = ["pytest>=8", "hypothesis>=6.90", "ruff>=0.4", "mypy>=1.8", "pandas-stubs", "types-PyYAML", "mkdocs>=1.5"]

[project.scripts]
skeptic = "skeptic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["studies/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
